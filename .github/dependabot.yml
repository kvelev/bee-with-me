# Dependabot reads this file from the DEFAULT branch (main) only, so a change here takes effect after
# the next release to main. Updates go to develop like every other change (CONTRIBUTING.md): they are
# tested and deployed there first and reach main with the next release.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    target-branch: develop
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned on purpose: export.py relies on the WeasyPrint 70.x URLFetcher API
      - dependency-name: weasyprint
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ['*']
