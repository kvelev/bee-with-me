name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    name: Tag matches versions & changelog
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py=$(sed -nE "s/^APP_VERSION = '([^']+)'.*/\1/p" backend/version.py)
          js=$(node -p "require('./frontend/package.json').version")
          echo "tag=$tag backend=$py frontend=$js"
          fail=0
          [ "$py" = "$tag" ] || { echo "::error file=backend/version.py::APP_VERSION is $py, tag is $tag"; fail=1; }
          [ "$js" = "$tag" ] || { echo "::error file=frontend/package.json::version is $js, tag is $tag"; fail=1; }
          grep -qF "## [$tag]" CHANGELOG.md || { echo "::error file=CHANGELOG.md::no '## [$tag]' section"; fail=1; }
          exit $fail

  ci:
    name: CI
    needs: verify-version
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish GitHub Release
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Release notes from CHANGELOG.md
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v h="## [$tag]" '
            index($0, h) == 1 { on = 1; next }
            on && /^## \[/    { exit }
            on                { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Offline install bundle + checksum
        # Field laptops are installed from a USB stick; the checksum lets the operator verify the copy.
        run: |
          name="bee-with-me-${GITHUB_REF_NAME}"
          git archive --format=zip --prefix="${name}/" -o "${name}.zip" "${GITHUB_REF_NAME}"
          sha256sum "${name}.zip" > "${name}.zip.sha256"
          cat "${name}.zip.sha256"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag \
            "bee-with-me-${GITHUB_REF_NAME}.zip" "bee-with-me-${GITHUB_REF_NAME}.zip.sha256"
