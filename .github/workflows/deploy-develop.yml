name: Deploy develop

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Queue, never cancel: the last push must be the last pin written to deploy/develop
  group: deploy-develop
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/kvelev/bee-with-me

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Image (${{ matrix.component }})
    needs: ci
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/${{ matrix.component }}.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:develop
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  pin:
    name: Pin images on deploy/develop
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Holds DEPLOY_DEVELOP_SSH_KEY; GitHub refuses this job outright on any branch but develop
    environment:
      name: develop
    permissions:
      contents: read   # the push below authenticates with the deploy key, not GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          ssh-key: ${{ secrets.DEPLOY_DEVELOP_SSH_KEY }}

      - name: Point the kustomization at this commit's images
        working-directory: deploy/k8s/app
        run: |
          kustomize edit set image \
            "${IMAGE_PREFIX}-backend=${IMAGE_PREFIX}-backend:sha-${GITHUB_SHA}" \
            "${IMAGE_PREFIX}-frontend=${IMAGE_PREFIX}-frontend:sha-${GITHUB_SHA}"
          git diff

      - name: Force-push deploy/develop
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "deploy: develop @ ${GITHUB_SHA::7}"
          git push --force origin HEAD:refs/heads/deploy/develop
          echo "### Pinned \`${GITHUB_SHA::7}\` on deploy/develop" >> "$GITHUB_STEP_SUMMARY"
