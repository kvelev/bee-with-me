apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: rescuer_locator
  POSTGRES_USER: rescuer
  # There is no start.sh here to take the pre-migration backup the runner asks for; this
  # database is dev data, so migrate on boot without it (logs a WARNING by design).
  ALLOW_MIGRATE_WITHOUT_BACKUP: "true"
  # No USB gateway in a cluster: Settings → Test mode (and POST /api/test/simulate) feed fake positions
  ENABLE_TEST_ENDPOINTS: "true"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-data
spec:
  accessModes: [ ReadWriteOnce ]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  # Zero-downtime rollout: the new pod starts next to the old one and takes traffic only once

  replicas: 1
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: bee-backend
  template:
    metadata:
      labels:
        app: bee-backend
    spec:
      # Hardened: if the app is ever compromised it gets no Kubernetes API token, no capabilities
      # and no writable filesystem beyond its data volume and /tmp.
      automountServiceAccountToken: false
      # preStop (10 s) + uvicorn's graceful shutdown (20 s, see backend.Dockerfile) fit in here
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: backend
        image: ghcr.io/kvelev/bee-with-me-backend
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ ALL ]
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: backend-config
        - secretRef:
            name: bee-with-me-secrets # POSTGRES_PASSWORD, SECRET_KEY, OFFLINE_MAPS_PASSWORD, INITIAL_ADMIN_PASSWORD, OWM_API_KEY
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            # the app fits a 2 CPU / 4Gi quota even mid-rollout (see frontend.yaml)
            cpu: 650m
            memory: 1280Mi
        # Leave the ingress' endpoint list before shutting down, so no request hits a closing pod.
        # (Native sleep action: no shell or binary needed in the read-only image.)
        lifecycle:
          preStop:
            sleep:
              seconds: 10
        # Migrations run in the lifespan before the app answers; give a fresh DB time
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 5
          failureThreshold: 36
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 20
          timeoutSeconds: 5
        volumeMounts:
        - name: data
          mountPath: /app/backend/uploads
          subPath: uploads
        - name: data
          mountPath: /app/tiles
          subPath: tiles
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
      - name: data
        persistentVolumeClaim:
          claimName: backend-data
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: bee-backend
  ports:
  - port: 8000
    targetPort: 8000
